<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" role="img" aria-label="Lumen">
  <!--
    Lumen mark: an aperture. A solid rounded square in Linear's lavender with a diamond
    opening cut clean through it.

    Abstract and geometric by request — no letterform, so it cannot be mistaken for the
    wordmark beside it, and it collides with no icon set. The opening is the idea: a
    lumen is light through an aperture onto a surface.

    The cut is a real hole (fill-rule evenodd) rather than a filled shape, so the mark
    carries exactly one colour and adapts to whatever sits behind it — a dark tab strip,
    a light one, a pinned tab, forced-colors.

    Chosen by rendering five candidates at 16/20/32/64/200px against the panel colour and
    reading the 16px pixel grid. Two that looked strong at 200px (a three-bar beam, a
    stepped stack) fragmented into scattered dots at favicon size; this one holds a clean
    4px aperture with unbroken walls.
  -->
  <path fill="#5e6ad2" fill-rule="evenodd"
        d="M8 4h16a4 4 0 0 1 4 4v16a4 4 0 0 1-4 4H8a4 4 0 0 1-4-4V8a4 4 0 0 1 4-4Zm8 6 6 6-6 6-6-6 6-6Z"/>
</svg>
