<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" role="img" aria-label="Lumen">
  <!--
    Lumen mark: a bracketed serif L reversed out of an ink field.

    Every coordinate is an even number so that at 16px (where 2 units = 1 device
    pixel) every edge of the letter lands on a whole pixel. Nudging the letter one
    unit right to centre it optically costs that alignment and softens every edge
    (23 antialiased pixels becomes 36), so the letter is deliberately left on the
    grid and sits one unit left of true centre — 0.5px at favicon size, invisible.

    The brackets — the two quadratics flowing out of the stem into the head serif —
    are the whole point. They keep a letterform reading as drawn rather than as an
    icon-set glyph. They soften out gracefully below 20px.

    Single colour by design — Sorbet's primary is ink, and the gradient stays the
    protagonist. The silhouette carries 100% of the identity, so the mark survives
    monochrome, Safari pinned tabs, forced-colors and dark backgrounds.
  -->
  <rect width="32" height="32" rx="12" fill="#1c1b22"/>
  <path d="M6 8 H18 V10 Q14 10 14 13 V20 H24 V24 H10 V13 Q10 10 6 10 Z" fill="#ffffff"/>
</svg>
