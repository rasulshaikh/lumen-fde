name: Production monitor
on:
  schedule:
    - cron: '17,47 * * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: production-monitor
  cancel-in-progress: false
jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Check production and scheduled work independently
        run: |
          export MONITORING_STARTED_AT="$(git log --diff-filter=A -1 --format=%cI -- scripts/monitor-production.mjs)"
          node scripts/monitor-production.mjs
