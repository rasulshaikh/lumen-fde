name: Build dashboard

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build

      # The suites ran only when someone remembered to run them, which is how a scheduler
      # defect reached main: `next build` type-checks but executes no assertion, so every
      # behavioural claim in 1,387 lines of tests was unenforced. Each suite calls
      # process.exit(fails ? 1 : 0), so a failure fails the job with no extra reporter.
      #
      # `test:motivation` is listed here because it was NOT, from the day the motivation layer
      # shipped until the companion work. The suite existed, passed locally, and was never run by
      # CI — so the layer whose whole job is to survive month 12 unchanged was the one layer a
      # regression could reach main through. Adding a suite to package.json is not adding it to
      # CI; every new suite belongs in both, which is why this list is now exhaustive.
      - run: npm run test:market
      - run: npm run test:surfacing
      - run: npm run test:insight
      - run: npm run test:review
      - run: npm run test:motivation
      - run: npm run test:companion
      - run: npm run test:brief
      - run: npm run test:session

      # Documentation drift is a build failure, not a chore. docs/platform/*.md pin their
      # numbers to anchors resolved from workbook.json and the source itself, so a plan
      # rebaseline that leaves a doc claiming the old hours stops here rather than shipping.
      - run: python3 scripts/verify-docs.py
